<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenDesign Decks</title>
  <style>
    :root {
      --bg: #0b0f14;
      --fg: #f2f5f7;
      --muted: rgba(242, 245, 247, 0.62);
      --accent: #f0b45a;
      --glass: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--fg);
      font: 16px/1.6 "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(700px 600px at 12% 18%, rgba(240, 180, 90, 0.18), transparent 62%),
        radial-gradient(700px 600px at 88% 20%, rgba(76, 125, 255, 0.16), transparent 65%),
        radial-gradient(700px 600px at 70% 92%, rgba(43, 217, 196, 0.13), transparent 62%),
        var(--bg);
    }
    main {
      width: min(760px, 100%);
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
      box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.24);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
      backdrop-filter: blur(24px) saturate(145%);
    }
    h1 { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 42px; font-weight: 500; line-height: 1.3; }
    p { margin-top: 12px; color: var(--muted); }
    nav { margin-top: 28px; display: grid; gap: 12px; }
    a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 18px 20px;
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      transition: background .15s, transform .15s;
    }
    a:hover { background: rgba(255,255,255,.10); transform: translateY(-1px); }
    a span { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; letter-spacing: .06em; }
    footer { margin-top: 26px; color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; letter-spacing: .06em; }
  </style>
</head>
<body>
  <main>
    <h1>OpenDesign 演示稿</h1>
    <p>选择要打开的版本。建议用 Chrome / Edge / Safari，方向键翻页。</p>

      <a href="design-reference-glass.html"><b>3 页设计样张 · 玻璃拟态</b><span>3 PAGES / GLASS</span></a>
      <a href="design-reference.html"><b>3 页设计样张 · 初版</b><span>3 PAGES / ORIGINAL</span></a>
    </nav>
    <footer>DATA CUTOFF 2026.11.09 · 仅本地演示</footer>
  </main>
</body>
</html>
